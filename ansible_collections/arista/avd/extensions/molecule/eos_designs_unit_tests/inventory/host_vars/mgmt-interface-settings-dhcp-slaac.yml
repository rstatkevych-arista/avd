# Test DHCP and SLAAC enablement through mgmt_interface_settings rather than node mgmt_ip.
type: l2leaf
mgmt_interface_settings:
  vrf: MGMT
  description: "Management Interface - DHCP"
  ipv4:
    dhcp: true
    accept_default_route: true
  ipv6:
    slaac: true
    accept_default_route: true
l2leaf:
  nodes:
    - name: mgmt-interface-settings-dhcp-slaac
      id: 201
